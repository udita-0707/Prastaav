server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compose's DNS. Resolving per request keeps /api working after the backend container restarts.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        # The browser's host and port, so the backend sees a same-origin request.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routes such as /projects/12 are served by the single-page app.
    location / {
        try_files $uri /index.html;
    }
}
