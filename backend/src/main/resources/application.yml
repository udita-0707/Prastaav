spring:
  application:
    name: prastav-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/prastav}
    username: ${DB_USER:prastav}
    password: ${DB_PASSWORD:prastav}
  jpa:
    # Flyway owns the schema; Hibernate never creates or alters tables.
    hibernate:
      ddl-auto: none
    # Mapping to DTOs happens after the service transaction; associations the mappers read are eager.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

prastav:
  jwt:
    # Development default only. Override with JWT_SECRET (at least 32 bytes) outside a demo.
    secret: ${JWT_SECRET:prastav-dev-only-secret-change-me-0123456789}
    expiration-minutes: 60
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:5173}
  institution:
    name: ${INSTITUTION_NAME:Newton School of Technology, Rishihood University}
    email-domain: ${INSTITUTION_EMAIL_DOMAIN:nst.rishihood.edu.in}
    # Local part of a student email: <firstname>.<YY><branch>, e.g. aarav.23csai (admission year 2023, branch CSAI).
    student-email-pattern: '[a-z]+\.(?<year>\d{2})(?<branch>[a-z]+)'
  seed:
    enabled: ${SEED_DEMO_DATA:true}
    # Shared password of every demo account. Development default only.
    demo-password: ${DEMO_PASSWORD:Password@123}
  notification:
    # Channels every notification is sent through, in order: in-app (stored inbox) and email (logged only).
    enabled-channels: ${NOTIFICATION_CHANNELS:in-app,email}
    # Every channel is retried: attempts in total including the first, and the pause between attempts.
    retry:
      max-attempts: ${NOTIFICATION_RETRY_MAX_ATTEMPTS:3}
      delay: ${NOTIFICATION_RETRY_DELAY:200ms}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
